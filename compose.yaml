services:
  explorer:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - acmm_explorer_node_modules:/workspace/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev"

volumes:
  acmm_explorer_node_modules:
